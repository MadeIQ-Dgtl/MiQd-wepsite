name: Deploy MiQd website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate internal links
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          import sys

          root = Path('.').resolve()
          broken = []

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ('href', 'src'):
                      value = attrs.get(key)
                      if value:
                          self.refs.append(value)

          for page in Path('.').glob('*.html'):
              parser = Links()
              parser.feed(page.read_text(encoding='utf-8'))
              for ref in parser.refs:
                  parts = urlsplit(ref)
                  if parts.scheme or parts.netloc or ref.startswith(('#', 'mailto:', 'tel:', 'data:', 'javascript:')):
                      continue
                  path = unquote(parts.path)
                  if not path:
                      continue
                  target = (page.parent / path).resolve()
                  try:
                      target.relative_to(root)
                  except ValueError:
                      broken.append((page.as_posix(), ref, 'outside repository'))
                      continue
                  if path.endswith('/'):
                      target = target / 'index.html'
                  if not target.exists():
                      broken.append((page.as_posix(), ref, 'missing'))

          if broken:
              print('Broken internal references found:')
              for page, ref, reason in broken:
                  print(f'  {page}: {ref} ({reason})')
              sys.exit(1)
          print('Internal link validation passed.')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
