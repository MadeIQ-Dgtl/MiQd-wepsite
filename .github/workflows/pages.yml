name: Deploy MiQd website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate internal links
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          import sys

          root = Path('.').resolve()
          pages_prefix = '/MiQd-wepsite/'
          broken = []
          page_cache = {}

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
                  self.anchors = set()
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ('href', 'src'):
                      value = attrs.get(key)
                      if value:
                          self.refs.append(value)
                  if attrs.get('id'):
                      self.anchors.add(attrs['id'])
                  if tag == 'a' and attrs.get('name'):
                      self.anchors.add(attrs['name'])

          def parse_page(path):
              path = path.resolve()
              if path not in page_cache:
                  parser = Links()
                  parser.feed(path.read_text(encoding='utf-8'))
                  page_cache[path] = parser
              return page_cache[path]

          for page in Path('.').glob('*.html'):
              parser = parse_page(page)
              for ref in parser.refs:
                  parts = urlsplit(ref)
                  if parts.scheme or parts.netloc or ref.startswith(('mailto:', 'tel:', 'data:', 'javascript:')):
                      continue
                  path = unquote(parts.path)
                  if path:
                      if path.startswith(pages_prefix):
                          target = (root / path[len(pages_prefix):]).resolve()
                      elif path.startswith('/'):
                          target = (root / path.lstrip('/')).resolve()
                      else:
                          target = (page.parent / path).resolve()
                      try:
                          target.relative_to(root)
                      except ValueError:
                          broken.append((page.as_posix(), ref, 'outside repository'))
                          continue
                      if path.endswith('/'):
                          target = target / 'index.html'
                  else:
                      target = page.resolve()
                  if not target.exists():
                      broken.append((page.as_posix(), ref, 'missing'))
                      continue
                  if parts.fragment and target.suffix.lower() == '.html':
                      target_parser = parse_page(target)
                      fragment = unquote(parts.fragment)
                      if fragment not in target_parser.anchors:
                          broken.append((page.as_posix(), ref, 'missing anchor'))

          if broken:
              print('Broken internal references found:')
              for page, ref, reason in broken:
                  print(f'  {page}: {ref} ({reason})')
              sys.exit(1)
          print('Internal link and anchor validation passed.')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
